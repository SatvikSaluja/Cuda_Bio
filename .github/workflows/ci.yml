name: CPU, packaging, Studio and documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} && cmake --build build -j2 && ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix /tmp/warpalign-install
      - run: ${{ matrix.compiler }} -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/unit/core.cpp -o /tmp/test-core && /tmp/test-core
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: cd apps/studio && npm ci && npm run build && npm test
      - run: python scripts/check_version.py
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - run: python -m pip install "$(echo dist/*.whl)[studio,test,docs]"
      - run: python -m pytest -q
      - run: cd /tmp && python "$GITHUB_WORKSPACE/scripts/check_install.py"
      - run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: packages-python-${{ matrix.python }}
          path: dist/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd apps/studio && npm ci && npm run build
      - run: python -m pip install '.[studio]' && npm install --prefix tests/e2e playwright@1.62.1
      - run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Exercise the live local application
        run: |
          WARPALIGN_DATA_DIR="$RUNNER_TEMP/warpalign-data" warpalign-studio > "$RUNNER_TEMP/studio.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/status && break || sleep 1; done
          node tests/e2e/studio.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t warpalign:test .
      - name: Run packaged demo through container networking
        run: |
          docker run -d --name warpalign-demo -p 127.0.0.1:8000:8000 warpalign:test
          trap 'docker logs warpalign-demo; docker rm -f warpalign-demo' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/status && break || sleep 1; done
          python tests/e2e/docker_smoke.py
