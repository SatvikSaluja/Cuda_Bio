name: Build v1 release draft
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py --tag "$RELEASE_TAG"
      - run: python -m pip install -e '.[studio,test,docs]' build twine
      - run: cmake -S . -B build-cpu -DENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build-cpu -j2 && ctest --test-dir build-cpu --output-on-failure
      - run: python -m pytest -q
      - run: bash scripts/build_release.sh
      - run: python -m mkdocs build --strict
      - name: Verify the built wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --no-deps dist/*/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/check_install.py"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*/*.whl
            dist/*/*.tar.gz
            dist/*/SHA256SUMS
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create or refresh a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Refusing to modify a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "WarpAlign $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
