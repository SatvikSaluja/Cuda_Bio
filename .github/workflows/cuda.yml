name: CUDA device validation (manual hardware runner)
on: workflow_dispatch
jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi && nvcc --version
      - run: cmake -S . -B build-cuda -DWARPALIGN_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=native && cmake --build build-cuda -j2
      - run: ./build-cuda/test-cuda
      - run: compute-sanitizer --error-exitcode 1 ./build-cuda/test-cuda
